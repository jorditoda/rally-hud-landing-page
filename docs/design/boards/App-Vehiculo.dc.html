<!doctype html>

</head>
<body>
<x-dc>
<helmet>

<style>body{margin:0}a:focus-visible{outline:2px solid #3DD6FF;outline-offset:2px}</style>
</helmet>
<div style="--bg:#070B16;--s1:#0E1526;--s2:#151E36;--ln:#243050;--tx:#EAF0FF;--t2:#A3B0D0;--t3:#8190B5;--cy:#3DD6FF;--cyi:#031520;--gr:#4ADE80;--or:#FF7A45;--vi:#B794FF;--am:#FFC247;--er:#FF4D5E;width:390px;height:844px;box-sizing:border-box;padding:58px 20px 34px;background:var(--bg);color:var(--tx);font-family:'Barlow',sans-serif;display:flex;flex-direction:column;overflow:hidden">

<div style="flex:none;height:44px;display:flex;align-items:center;justify-content:space-between">
<a href="App-Garaje.dc.html" aria-label="Volver al garaje" style="width:44px;height:44px;border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:var(--s1);border:1px solid var(--ln);color:var(--tx);text-decoration:none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
</div>

<h1 style="flex:none;margin:10px 0 0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:42px;line-height:1">Editar vehículo</h1>

<div style="flex:none;margin-top:14px;display:flex;align-items:center;gap:14px">
<span style="flex:none;width:88px;height:88px;border-radius:18px;background:var(--s1);border:1.5px dashed var(--t3);display:flex;align-items:center;justify-content:center;color:var(--t2)">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
</span>
<div style="flex:1;min-width:0;line-height:1.3">
<div style="font-size:17px;font-weight:600">Foto del vehículo</div>
<div style="font-size:14px;color:var(--t2)">Opcional</div>
<button type="button" style="margin-top:6px;height:40px;box-sizing:border-box;padding:0 16px;border-radius:12px;background:transparent;border:1.5px solid var(--ln);color:var(--tx);font-family:'Barlow',sans-serif;font-size:15px;font-weight:600;cursor:pointer">Elegir foto</button>
</div>
</div>

<div style="flex:none;margin-top:14px;display:flex;gap:10px">
<div style="flex:1;min-width:0">
<div style="font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t2)">Marca</div>
<div style="margin-top:6px;height:52px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;border-radius:14px;background:var(--s1);border:1px solid var(--ln);font-size:18px;font-weight:500">Renault</div>
</div>
<div style="flex:1;min-width:0">
<div style="font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t2)">Modelo</div>
<div style="margin-top:6px;height:52px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;border-radius:14px;background:var(--s1);border:1px solid var(--ln);font-size:18px;font-weight:500">Clio RS</div>
</div>
</div>

<div style="flex:none;margin-top:14px">
<div style="font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t2)">Año</div>
<div aria-invalid="true" style="margin-top:6px;height:52px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-radius:14px;background:rgba(255,77,94,.08);border:1.5px solid var(--er);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums">
<span>1850</span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF4D5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>
</div>
<p role="alert" style="margin:6px 0 0;font-size:15px;line-height:1.35;color:var(--er);font-weight:500">El año debe estar entre 1950 y 2027.</p>
</div>

<div style="flex:none;margin-top:14px;display:flex;gap:10px">
<div style="flex:1;min-width:0">
<div style="font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t2)">Potencia <span style="font-weight:500;letter-spacing:0;text-transform:none;color:var(--t3)">(CV)</span></div>
<div style="margin-top:6px;height:52px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;border-radius:14px;background:var(--s1);border:1px solid var(--ln);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums">200</div>
</div>
<div style="flex:1;min-width:0">
<div style="font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t2)">Par <span style="font-weight:500;letter-spacing:0;text-transform:none;color:var(--t3)">(Nm)</span></div>
<div style="margin-top:6px;height:52px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;border-radius:14px;background:var(--s1);border:1px solid var(--ln);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums">240</div>
</div>
</div>

<div style="flex:none;margin-top:14px;height:56px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;gap:12px;border-radius:14px;background:var(--s1);border:1px solid var(--ln)">
<span style="flex:1;font-size:17px;font-weight:600">Usar como vehículo activo</span>
<span role="switch" aria-checked="true" aria-label="Usar como vehículo activo" style="flex:none;width:52px;height:30px;box-sizing:border-box;padding:3px;border-radius:999px;background:var(--cy);display:flex;justify-content:flex-end"><span style="width:24px;height:24px;border-radius:50%;background:var(--cyi)"></span></span>
</div>

<div style="flex:1"></div>

<p style="flex:none;margin:0 0 8px;text-align:center;font-size:14px;color:var(--t2)">Corrige el año para poder guardar.</p>
<button type="button" aria-disabled="true" style="flex:none;height:56px;box-sizing:border-box;border-radius:16px;background:var(--s2);border:1px solid var(--ln);color:var(--t3);font-family:'Barlow',sans-serif;font-size:19px;font-weight:700;cursor:not-allowed">Guardar cambios</button>
<button type="button" style="flex:none;margin-top:4px;height:44px;background:transparent;border:0;color:var(--er);font-family:'Barlow',sans-serif;font-size:16px;font-weight:600;cursor:pointer">Eliminar vehículo</button>

</div>
